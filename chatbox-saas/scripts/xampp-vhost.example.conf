# Exemplo de Virtual Host Apache (XAMPP)
# 1. Copie para C:\xampp\apache\conf\extra\httpd-vhosts.conf (ou inclua via Include)
# 2. Adicione em C:\Windows\System32\drivers\etc\hosts: 127.0.0.1 chatbox.local
# 3. Ajuste DocumentRoot para o caminho real do projecto (sempre a pasta public/)
# 4. Reinicie Apache no XAMPP Control Panel
# 5. Defina APP_URL=http://chatbox.local no .env

<VirtualHost *:80>
    ServerName chatbox.local
    DocumentRoot "C:/Projetos/ProjetoChatbot/chatbox-saas/public"

    <Directory "C:/Projetos/ProjetoChatbot/chatbox-saas/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/chatbox-error.log"
    CustomLog "logs/chatbox-access.log" combined
</VirtualHost>
